<!DOCTYPE html>
<html>
<head>
    <title>Partyline</title>
</head>
<body>
    <div id="PartylineConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="PartylineConfigForm">
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label><input id="EnableVoiceChat" type="checkbox" is="emby-checkbox" /><span>Enable voice chat</span></label>
                    </div>
                    <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="StunUrl">STUN URL(s)</label><input id="StunUrl" is="emby-input" /><div class="fieldDescription">Comma-separated. Leave empty for host candidates only.</div></div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label><input id="EnableTurn" type="checkbox" is="emby-checkbox" /><span>Enable TURN</span></label>
                    </div>
                    <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="TurnUrl">TURN URL(s)</label><input id="TurnUrl" is="emby-input" placeholder="turn:host:3478?transport=udp, turn:host:3478?transport=tcp" /></div>
                    <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="TurnTlsUrl">TURN TLS URL(s)</label><input id="TurnTlsUrl" is="emby-input" placeholder="turns:host:5349?transport=tcp" /></div>
                    <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="TurnSharedSecret">coturn shared secret</label><input id="TurnSharedSecret" type="password" is="emby-input" autocomplete="new-password" /><div class="fieldDescription">Stored only in Jellyfin's plugin configuration. Browsers receive short-lived credentials, never this secret.</div></div>
                    <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                'use strict';
                const pluginId = '9512396d-7364-4d1f-aa1a-aa719e8ee3ff';
                const page = document.querySelector('#PartylineConfigPage');
                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        page.querySelector('#EnableVoiceChat').checked = config.EnableVoiceChat;
                        page.querySelector('#StunUrl').value = config.StunUrl || '';
                        page.querySelector('#EnableTurn').checked = config.EnableTurn;
                        page.querySelector('#TurnUrl').value = config.TurnUrl || '';
                        page.querySelector('#TurnTlsUrl').value = config.TurnTlsUrl || '';
                        page.querySelector('#TurnSharedSecret').value = config.TurnSharedSecret || '';
                        Dashboard.hideLoadingMsg();
                    });
                });
                page.querySelector('#PartylineConfigForm').addEventListener('submit', function (event) {
                    event.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.EnableVoiceChat = page.querySelector('#EnableVoiceChat').checked;
                        config.StunUrl = page.querySelector('#StunUrl').value.trim();
                        config.EnableTurn = page.querySelector('#EnableTurn').checked;
                        config.TurnUrl = page.querySelector('#TurnUrl').value.trim();
                        config.TurnTlsUrl = page.querySelector('#TurnTlsUrl').value.trim();
                        config.TurnSharedSecret = page.querySelector('#TurnSharedSecret').value;
                        return ApiClient.updatePluginConfiguration(pluginId, config);
                    }).then(Dashboard.processPluginConfigurationUpdateResult);
                    return false;
                });
            })();
        </script>
    </div>
</body>
</html>
