name: '🔬 Run CodeQL'

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@master
    with:
      repository-name: Llewellyn500/jellyfin-partyline
      dotnet-version: '9.0.x'
